# Déploiement d'Ostal. Voir INSTALLATION.md pour le guide complet.
# Les réglages se font dans un fichier .env (copier .env.example).
services:
  notes:
    build: .
    ports:
      # Port d'accès sur le serveur (NOTES_PORT dans .env) ; changez-le s'il est déjà utilisé
      - '${NOTES_PORT:-3000}:3000'
    environment:
      # Adresse publique HTTPS (ex. https://notes.mondomaine.fr) : liens de partage et fichiers importés
      - PUBLIC_URL=${PUBLIC_URL:-}
      # 1 = seul votre espace peut exister sur ce serveur (recommandé s'il est accessible depuis Internet)
      - MAX_WORKSPACES=${MAX_WORKSPACES:-1}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
      # Réveil des ordinateurs et recherche des applications : par le relais réseau (service wol ci-dessous)
      - WOL_RELAY=/run/melo-wol/relay.sock
      # Sauvegardes (Réglages → Sauvegardes) : dans le dossier ./sauvegardes ci-dessous
      - BACKUP_DIR=/backups
      - BACKUP_DIR_KIND=docker
    volumes:
      # Toutes les données (pages, fichiers importés, liens de partage) : dossier ./data
      - ./data:/data
      # Sauvegardes faites par Ostal (chaque nuit et à la demande). Pour les mettre sur un disque USB ou un NAS,
      # remplacez ./sauvegardes par son chemin dans docker-compose.override.yml (voir INSTALLATION.md).
      - ./sauvegardes:/backups
      - wol-relay:/run/melo-wol
      # Tableau de bord homelab : montez ici en lecture seule les disques à surveiller, par exemple :
      # - /mnt/media:/mnt/media:ro
    restart: unless-stopped

  # Relais réseau (widget « Allumer un PC », recherche des applications du homelab) : depuis le réseau Docker du
  # serveur, ni le signal de réveil ni la recherche n'atteignent tout le réseau de la maison. Ce petit service tourne sur
  # le réseau de la machine (network_mode: host), sans port ouvert ni accès aux données : il ne parle qu'au serveur, par
  # un fichier partagé (volume wol-relay).
  wol:
    build: .
    command: ['node', 'server/src/wol-relay.js']
    network_mode: host
    cap_add: [NET_RAW]
    environment:
      - WOL_RELAY=/run/melo-wol/relay.sock
    volumes:
      - wol-relay:/run/melo-wol
    restart: unless-stopped

  # Option A – Cloudflare Tunnel : docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on: [notes]
    restart: unless-stopped
    profiles: [tunnel]

  # Option B – Caddy (HTTPS automatique, ports 80/443 ouverts sur la box) : docker compose --profile caddy up -d
  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [notes]
    restart: unless-stopped
    profiles: [caddy]

volumes:
  caddy-data:
  caddy-config:
  wol-relay:
