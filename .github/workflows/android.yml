name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: "Tester seulement l'APK d'une exécution précédente (identifiant de l'exécution, visible dans son adresse), sans construire ni publier"
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-${{ github.ref }}-${{ inputs.apk_run_id || 'build' }}
  cancel-in-progress: true

jobs:
  apk:
    name: Construire l'APK
    if: ${{ !inputs.apk_run_id }}
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le client web
        run: npm run build
        env:
          # Variables de dépôt optionnelles (Settings → Secrets and variables → Actions → Variables)
          VITE_DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - name: Copier le client dans le projet Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le SDK Android (préinstallé sur ubuntu-latest)
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Construire l'APK (debug, installable directement)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../notes-debug.apk

      - name: Construire l'APK release signé (si un keystore est configuré)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../notes-release.apk

      - name: Publier l'APK comme artefact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: notes-apk
          path: |
            notes-debug.apk
            notes-release.apk
          if-no-files-found: error

  # L'APK est essayé sur un vrai système Android avant d'être publié : une application qui se ferme au lancement
  # ne doit jamais arriver sur un téléphone.
  smoke:
    name: Tester l'APK sur un émulateur Android 14
    needs: apk
    if: ${{ !cancelled() && (needs.apk.result == 'success' || inputs.apk_run_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le client (serveur de test) et une nouvelle version pour tester la mise à jour
        run: |
          npm run build
          cp -r client/dist "$RUNNER_TEMP/client-v1"
          printf '\n// Version de test : mise à jour sur l’émulateur\n' >> client/src/main.tsx
          npm run build
          cp -r client/dist "$RUNNER_TEMP/client-v2"
          git checkout -- client/src/main.tsx
          rm -rf client/dist
          cp -r "$RUNNER_TEMP/client-v1" client/dist

      - name: Récupérer l'APK construit
        if: ${{ !inputs.apk_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: notes-apk
          path: apk

      - name: Récupérer l'APK de l'exécution demandée
        if: ${{ inputs.apk_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: notes-apk
          path: apk
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}

      - name: Activer KVM (émulateur accéléré)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "Émulateur : lancement, liaison au serveur, notification et mise à jour"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/android-smoke/run.sh apk/notes-debug.apk "$RUNNER_TEMP/client-v2"

      - name: Journaux du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-emulateur
          path: smoke-out
          if-no-files-found: ignore

  release:
    name: Publier l'APK
    needs: [apk, smoke]
    if: ${{ github.event_name != 'pull_request' && !inputs.apk_run_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes-apk

      - name: Publier l'APK dans une Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; PRE=""
          elif [[ "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]]; then
            TAG="latest"; PRE="--prerelease"
          else
            SAFE="$(echo "$GITHUB_REF_NAME" | sed 's#[^A-Za-z0-9._-]#-#g')"
            TAG="apk-$SAFE"; PRE="--prerelease"
          fi
          FILES="notes-debug.apk"
          [ -f notes-release.apk ] && FILES="$FILES notes-release.apk"
          if [[ "$TAG" != v* ]]; then
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          fi
          {
            echo "APK Android construit automatiquement depuis la branche \`$GITHUB_REF_NAME\` (commit $GITHUB_SHA)."
            echo
            echo "- **notes-debug.apk** : installable directement sur le téléphone (autoriser les sources inconnues)."
            echo "- **notes-release.apk** : présent uniquement si un keystore de release est configuré dans les secrets du dépôt."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" $FILES $PRE \
            --target "$GITHUB_SHA" \
            --title "Melo – APK Android ($TAG)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release upload "$TAG" $FILES --clobber
